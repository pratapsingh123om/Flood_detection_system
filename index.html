<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainfall Prediction Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-8 font-sans">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8">
            <h1 class="text-4xl font-bold text-blue-900">🌦️ BTP Model Performance Dashboard</h1>
            <p class="text-gray-600 mt-2">Last Updated: 2026-08-10 13:52:33</p>
        </header>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-2xl font-semibold mb-4">Model Metrics Comparison</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <canvas id="rmseChart"></canvas>
                </div>
                <div>
                    <canvas id="csiChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Inject Python JSON directly into JavaScript
        const projectData = {"project_name": "Indore Rainfall Prediction Model", "last_updated": "2026-08-10 13:52:33", "models": {"Tuned Asymmetric Hybrid": {"description": "1.8x Penalty on >25mm missed events", "metrics": {"RMSE": 6.3636, "MAE": 1.8911, "CSI": 0.7952, "Extreme_CSI": 0.3611}}}};
        const models = Object.keys(projectData.models);
        const rmseData = models.map(m => projectData.models[m].metrics.RMSE);
        const extCsiData = models.map(m => projectData.models[m].metrics.Extreme_CSI);

        // Chart.js Setup
        new Chart(document.getElementById('rmseChart'), {
            type: 'bar',
            data: {
                labels: models,
                datasets: [{ label: 'RMSE (Lower is better)', data: rmseData, backgroundColor: '#3b82f6' }]
            }
        });

        new Chart(document.getElementById('csiChart'), {
            type: 'bar',
            data: {
                labels: models,
                datasets: [{ label: 'Extreme CSI (Higher is better)', data: extCsiData, backgroundColor: '#ef4444' }]
            }
        });
    </script>
</body>
</html>
