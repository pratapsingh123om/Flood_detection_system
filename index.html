<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTP Model Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Leaflet CSS & JS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 350px; width: 100%; border-radius: 0.5rem; z-index: 1; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-6 min-h-screen">
    
    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-end pb-4 border-b border-slate-200">
            <div>
                <h1 class="text-3xl font-bold text-indigo-900 tracking-tight">🌦️ Model Performance Registry</h1>
                <p class="text-slate-500 mt-1">Multi-Region Analysis & Hyperparameter Tracking</p>
            </div>
            <div class="text-sm text-slate-400 font-mono">Last Run: 2026-08-10 14:10:47</div>
        </header>

        <!-- Top Row: Map & Charts -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Geographical Coverage -->
            <div class="glass-panel p-5 rounded-xl shadow-sm border border-slate-200 lg:col-span-1">
                <h2 class="text-lg font-semibold text-slate-700 mb-3">Geographical Coverage</h2>
                <div id="map" class="shadow-inner border border-slate-200"></div>
            </div>
            
            <!-- Metric Visualization -->
            <div class="glass-panel p-5 rounded-xl shadow-sm border border-slate-200 lg:col-span-2 flex flex-col justify-center">
                <h2 class="text-lg font-semibold text-slate-700 mb-3">RMSE vs Extreme CSI Comparison</h2>
                <div class="relative h-72 w-full">
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Bottom Row: Experiment Table -->
        <div class="glass-panel rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-200 bg-slate-100/50">
                <h2 class="text-lg font-semibold text-slate-700">Experiment Log & Parameters</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="expTable">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                            <th class="p-4 border-b">Model Architecture</th>
                            <th class="p-4 border-b">Location</th>
                            <th class="p-4 border-b">Key Parameters</th>
                            <th class="p-4 border-b text-right">RMSE</th>
                            <th class="p-4 border-b text-right">Ext. CSI</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm divide-y divide-slate-100" id="tableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Injecting Python Data into JavaScript -->
    <script>
        const projectData = {"project_name": "Pan-India Hybrid Rainfall Forecaster", "last_updated": "2026-08-10 14:10:47", "experiments": [{"id": "Tuned_Asym_Hybrid_Indore_0", "model_name": "Tuned Asym Hybrid", "location": "Indore", "coordinates": {"lat": 22.7196, "lon": 75.8577}, "parameters": {"Classifier": "LGBM (lr=0.03, n=300)", "Regressor": "LGBM Asymmetric (lr=0.03, n=350)", "Penalty_Multiplier": "1.8x", "Penalty_Threshold": ">25mm", "Activation_Threshold": "Prob >= 0.45"}, "metrics": {"RMSE": 6.3636, "MAE": 1.8911, "CSI": 0.7952, "Extreme_CSI": 0.3611}, "timestamp": "2026-08-10 14:10"}]};
        const experiments = projectData.experiments;

        // 1. Initialize Map
        // Center on India by default
        const map = L.map('map').setView([22.0, 79.0], 4); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Track unique locations for map markers
        const locMap = new Map();
        experiments.forEach(exp => {
            if(!locMap.has(exp.location)) {
                locMap.set(exp.location, exp.coordinates);
                L.marker([exp.coordinates.lat, exp.coordinates.lon])
                 .addTo(map)
                 .bindPopup(`<b>${exp.location}</b><br>Models Trained: ${experiments.filter(e => e.location === exp.location).length}`);
            }
        });

        // 2. Render Chart
        const labels = experiments.map(e => `${e.model_name} (${e.location})`);
        const rmseData = experiments.map(e => e.metrics.RMSE);
        const csiData = experiments.map(e => e.metrics.Extreme_CSI);

        new Chart(document.getElementById('performanceChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'RMSE (mm)',
                        data: rmseData,
                        backgroundColor: 'rgba(99, 102, 241, 0.8)', // Indigo
                        borderRadius: 4,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Extreme CSI',
                        data: csiData,
                        backgroundColor: 'rgba(239, 68, 68, 0.8)', // Red
                        borderRadius: 4,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    y: { type: 'linear', display: true, position: 'left', title: {display: true, text: 'RMSE (Lower is Better)'} },
                    y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: {display: true, text: 'Extreme CSI (Higher is Better)'} }
                }
            }
        });

        // 3. Render Table
        const tbody = document.getElementById('tableBody');
        experiments.reverse().forEach(exp => {
            // Format params nicely
            let paramString = "";
            for (const [key, value] of Object.entries(exp.parameters)) {
                paramString += `<span class="inline-block bg-slate-100 text-slate-600 rounded px-2 py-1 text-xs m-0.5 border border-slate-200"><b>${key}:</b> ${value}</span>`;
            }

            const row = `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-4 font-medium text-slate-800">${exp.model_name}</td>
                    <td class="p-4">
                        <div class="flex items-center text-slate-600">
                            <svg class="w-4 h-4 mr-1 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.242-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            ${exp.location}
                        </div>
                    </td>
                    <td class="p-4 max-w-md leading-relaxed">${paramString}</td>
                    <td class="p-4 text-right font-mono text-indigo-600 font-semibold">${exp.metrics.RMSE.toFixed(2)}</td>
                    <td class="p-4 text-right font-mono text-rose-600 font-semibold">${exp.metrics.Extreme_CSI.toFixed(3)}</td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    </script>
</body>
</html>
